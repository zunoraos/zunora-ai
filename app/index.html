<!-- Zunora-Look: Glas, Liquid, Federn, Elastik (zlook.js) -->
<script src="zlook.js"
  data-glass=".zm-list, .ring, .post, .srvstrip, .zm-login .card, #zm-toast, .bub:not(.sticker-msg), .transfer-card, .row.on"
  data-liquid=".navpill, .composer, .zm-main .head, .dlg"
  data-press="button, .row, .chan, .nav, .srvic, .pick, .hit, .sticker-pick, [data-act]"
  data-lists="#list .scroll, #mList, .srvstrip, #friendResults, .navpill"
  data-blob=".navpill"
  data-views="#main"
  data-elastic=".zm-list, .zm-main, .navpill, .dlg"></script>
</head>
